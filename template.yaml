AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for ImageApp Uploads Notification

Resources:
  UploadsNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ImageApp-UploadsNotificationFunction
      Handler: lambda_function.lambda_handler # Adjust based on your filename
      Runtime: python3.9.25
      CodeUri: ./ # Points to your current directory
      MemorySize: 128
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole # CloudWatch Logs
        - AmazonSQSReadOnlyAccess
        - SNSPublishMessagePolicy:
            TopicName: ImageApp-UploadsNotificationTopic
      Events:
        MySQSEvent:
          Type: SQS
          Properties:
            Queue: !ImportValue ImageApp-UploadsNotificationQueueArn # Or provide direct ARN
      DeploymentPreference:
        Type: Linear10PercentEvery1Minute # Canary/Linear deployment style
