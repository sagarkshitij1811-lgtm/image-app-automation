AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for UploadsNotificationFunction

Resources:
  UploadsNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler             # Ensure this matches your python filename and function name
      Runtime: python3.9               # Ensure this matches your code
      CodeUri: ./
      MemorySize: 128
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole  # Permission for CloudWatch Logs
        - SQSPollerPolicy:             # Permission to read from your SQS Queue
            QueueName: !GetAtt MySQSQueue.QueueName # OR use the QueueArn directly in the policy below if defining queue externally

      Events:
        MySQSEvent:
          Type: SQS
          Properties:
            Queue: "arn:aws:sqs:us-east-1:760659115700:ImageApp-UploadsNotificationQueue" # <--- PASTE YOUR MODULE 9 SQS ARN HERE
            BatchSize: 10

# Note: If your SQS queue exists from a different module, just pasting the ARN above is enough.
