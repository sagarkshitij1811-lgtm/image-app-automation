AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for UploadsNotificationFunction

Resources:
  UploadsNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      Runtime: python3.9
      CodeUri: ./
      MemorySize: 128
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole
        # Fixed Policy: We use the actual Queue Name string instead of !GetAtt
        - SQSPollerPolicy:
            QueueName: "ImageApp-UploadsNotificationQueue"
        # Added SNS Publish permission so the Lambda can send emails
        - SNSPublishMessagePolicy:
            TopicName: "ImageApp-UploadsNotificationTopic"

      Events:
        MySQSEvent:
          Type: SQS
          Properties:
            # This ARN is correct as a string
            Queue: "arn:aws:sqs:us-east-1:760659115700:ImageApp-UploadsNotificationQueue"
            BatchSize: 10
