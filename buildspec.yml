version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.9
  build:
    commands:
      - echo "Starting SAM build..."
      - sam build
      - echo "Packaging SAM application..."
      - sam package --output-template-file packaged.yaml --s3-bucket YOUR_ARTIFACT_BUCKET_NAME
artifacts:
  files:
    - packaged.yaml
